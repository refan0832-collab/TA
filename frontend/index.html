<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>⚡ PowerMonitor Dashboard</title>

  <!-- CHART JS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
<base target="_blank">
</head>

<body>

  <!-- TOGGLE BUTTON (tampil di semua ukuran layar) -->
  <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- OVERLAY (gelap saat sidebar terbuka) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="container" id="container">

    <!-- SIDEBAR (tersembunyi default) -->
    <aside class="sidebar" id="sidebar">

      <h2>Menu</h2>

      <ul>
        <li class="active">📊 Dashboard</li>
        <li>📈 History</li>
        <li>⚙️ Settings</li>
      </ul>

    </aside>

    <!-- MAIN -->
    <main class="main" id="main">

      <!-- HEADER -->
      <header class="header">

        <h1>Dashboard Monitoring Rumah</h1>

        <!-- WAKTU REAL-TIME + STATUS (tambahan baru) -->
        <div class="header-right">
          <div class="clock" id="clock">
            <span class="clock-time" id="clockTime">00:00:00</span>
            <span class="clock-date" id="clockDate">Senin, 1 Januari 2025</span>
          </div>

          <!-- STATUS -->
          <span id="connectionStatus">● Offline</span>
        </div>

      </header>

      <!-- KPI -->
    <!-- KPI GRID -->
      <section class="kpi-grid">

        <!-- VOLTAGE -->
        <div class="kpi-card voltage">
          <div class="kpi-header">
            <div class="kpi-label">Tegangan</div>
          </div>
          <div class="kpi-display">
            <div class="kpi-icon-box">⚡</div>
            <div class="kpi-data">
              <span class="kpi-value" id="tegangan">-</span>
              <span class="kpi-unit">Volt</span>
            </div>
          </div>
          <div class="kpi-footer">
            <span class="kpi-badge normal" id="voltageBadge">
              <span class="kpi-badge-dot"></span>
              <span id="voltageBadgeText">Normal</span>
            </span>
          </div>
        </div>

        <!-- CURRENT -->
        <div class="kpi-card current">
          <div class="kpi-header">
            <div class="kpi-label">Arus</div>
          </div>
          <div class="kpi-display">
            <div class="kpi-icon-box">🔌</div>
            <div class="kpi-data">
              <span class="kpi-value" id="arus">-</span>
              <span class="kpi-unit">Ampere</span>
            </div>
          </div>
          <div class="kpi-footer">
            <span class="kpi-badge warning" id="currentBadge">
              <span class="kpi-badge-dot"></span>
              <span id="currentBadgeText">Aman</span>
            </span>
          </div>
        </div>

        <!-- POWER -->
        <div class="kpi-card power">
          <div class="kpi-header">
            <div class="kpi-label">Daya</div>
          </div>
          <div class="kpi-display">
            <div class="kpi-icon-box">💡</div>
            <div class="kpi-data">
              <span class="kpi-value" id="daya">-</span>
              <span class="kpi-unit">Watt</span>
            </div>
          </div>
          <div class="kpi-footer">
            <!-- Optional -->
          </div>
        </div>

        <!-- FREQUENCY -->
        <div class="kpi-card frequency">
          <div class="kpi-header">
            <div class="kpi-label">Frekuensi</div>
          </div>
          <div class="kpi-display">
            <div class="kpi-icon-box">📡</div>
            <div class="kpi-data">
              <span class="kpi-value" id="frekuensi">-</span>
              <span class="kpi-unit">Hz</span>
            </div>
          </div>
          <div class="kpi-footer">
            <!-- Optional -->
          </div>
        </div>

      </section>

      </section>

      <!-- CONTENT GRID: CHART + STATUS PANEL -->
      <section class="content-grid">

        <!-- CHART -->
        <div class="chart-section">

          <div class="section-header">
            <h3>Grafik Monitoring Real-time</h3>
          </div>

          <div class="chart-container">
            <canvas id="chart"></canvas>
          </div>

        </div>

        <!-- STATUS PANEL (TAMBAHAN BARU - SATU KONTAINER) -->
        <div class="status-section">

          <div class="section-header">
            <h3>📋 Status Sistem</h3>
          </div>

          <div class="status-container">

            <!-- ESP STATUS -->
            <div class="status-row state-offline" id="espStatusRow">
              <div class="status-row-left">
                <div class="status-row-icon">📡</div>
                <div class="status-row-name">ESP32</div>
              </div>
              <div class="status-row-right">
                <span class="status-pill pill-offline" id="espPill">
                  <span class="status-pill-dot" id="espPillDot"></span>
                  <span id="espPillText">Offline</span>
                </span>
              </div>
            </div>

            <!-- LAST UPDATE -->
            <div class="status-row last-update-row">
              <div class="status-row-left">
                <div class="status-row-icon">🕐</div>
                <div class="status-row-name">Update Terakhir</div>
              </div>
              <div class="status-row-right">
                <div class="status-row-value time-value" id="lastUpdateValue">-</div>
              </div>
            </div>

          </div>

        </div>

      </section>

    </main>

  </div>

  <!-- APP JS -->
  <script src="app.js"></script>

</body>
</html>
